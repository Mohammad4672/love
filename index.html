<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Loading Surprise</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  background: black;
  color: white;
}

/* شاشة الدخول */
#start {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #1a1a2e, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  text-align: center;
  margin-top: 10px;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

/* شاشة التحميل */
#loadingScreen {
  display: none;
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at top, #000814, #000);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#bar {
  width: 70%;
  height: 15px;
  border: 1px solid white;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 20px;
}

#progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff4d6d, #ff7eb3);
  transition: 0.2s;
}

/* المشهد */
#scene {
  display: none;
  height: 100vh;
  background: radial-gradient(circle at top, #0b1320, #05060a);
}

/* نجوم */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 1; }
}

/* قمر */
.moon {
  position: absolute;
  top: 60px;
  left: 60px;
  width: 90px;
  height: 90px;
  background: #f5f3ce;
  border-radius: 50%;
  box-shadow: 0 0 40px rgba(255,255,200,0.6);
}

/* بطاقة */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  transition: 1s;
}

.card.show {
  transform: translate(-50%, -50%) scale(1);
}

/* قلوب */
.heart {
  position: absolute;
  width: 12px;
  height: 12px;
  background: #ff4d6d;
  transform: rotate(45deg);
  animation: boom 4s linear forwards;
}

.heart:before,
.heart:after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  background: #ff4d6d;
  border-radius: 50%;
}

.heart:before { top: -6px; }
.heart:after { left: -6px; }

@keyframes boom {
  0% { transform: translate(0,0) rotate(45deg); opacity: 1; }
  100% { transform: translate(var(--x), var(--y)) rotate(45deg); opacity: 0; }
}
</style>
</head>

<body>

<!-- دخول -->
<div id="start">
  <h1>🔐 Secret Access</h1>
  <p>اكتبي كلمة السر</p>
  <input id="pass" placeholder="******">
  <button onclick="check()">دخول</button>
</div>

<!-- loading -->
<div id="loadingScreen">
  <h1>💖 Loading Surprise...</h1>
  <p id="percent">0%</p>
  <div id="bar">
    <div id="progress"></div>
  </div>
</div>

<!-- المشهد -->
<div id="scene">
  <div class="moon"></div>

  <div class="card" id="card">
    <h1>💖 Ruba</h1>
    <p id="text"></p>
    <div id="final" style="margin-top:15px;color:#ff7eb3;opacity:0;transition:2s;">
      💫 إنتِ أغلى شي عندي… وانشالله بضل شوف الضحكة الحلوة على وجهك يا قلبي 💖
    </div>
  </div>
</div>

<script>

function check(){
  let val = document.getElementById("pass").value;

  if(val === "Ruba"){
    document.getElementById("start").style.display="none";
    document.getElementById("loadingScreen").style.display="flex";

    startLoading();
  } else {
    alert("❌ جرّبي مرة تانية");
  }
}

/* loading 0 → 100 */
function startLoading(){
  let p = 0;

  let load = setInterval(()=>{
    p++;
    document.getElementById("percent").innerText = p + "%";
    document.getElementById("progress").style.width = p + "%";

    if(p >= 100){
      clearInterval(load);
      setTimeout(openScene, 500);
    }
  }, 25);
}

/* فتح المفاجأة */
function openScene(){
  document.getElementById("loadingScreen").style.display="none";
  document.getElementById("scene").style.display="block";

  buildScene();
  showMessage();
}

/* نجوم */
function buildScene(){
  for(let i=0;i<120;i++){
    let s=document.createElement("div");
    s.classList.add("star");
    s.style.top=Math.random()*100+"vh";
    s.style.left=Math.random()*100+"vw";
    document.body.appendChild(s);
  }
}

/* رسالة */
let msg = "ما تزعلِي ولا تضايقي حالك 💖  ضحكتِك بتسوى الدنيا كلها عندي ✨ إذا في شي مدايقك، خليه عليي… إنتِ بس ابقي بخير 🌙💫 وبوعدك دايماً خليكِ مبسوطة وكون حدك لو شو ما صار 💖";
let i = 0;

function showMessage(){
  document.getElementById("card").classList.add("show");

  let t = setInterval(()=>{
    document.getElementById("text").innerHTML += msg[i];
    i++;

    if(i >= msg.length){
      clearInterval(t);
      explodeHearts();

      setTimeout(()=>{
        document.getElementById("final").style.opacity = "1";
      }, 1000);
    }
  }, 45);
}

/* قلوب */
function explodeHearts(){
  for(let i=0;i<130;i++){
    let h=document.createElement("div");
    h.classList.add("heart");

    let x = (Math.random()*200 - 100) + "vw";
    let y = (Math.random()*200 - 100) + "vh";

    h.style.setProperty("--x", x);
    h.style.setProperty("--y", y);

    document.body.appendChild(h);

    setTimeout(()=>h.remove(),4000);
  }
}

</script>

</body>
</html>
